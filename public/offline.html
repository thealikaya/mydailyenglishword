<!doctype html><html lang="tr"><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Bir Kelime · Çevrimdışı</title><style>body{background:#f7f7ef;color:#173e34;font:18px system-ui;max-width:600px;margin:12vh auto;padding:24px}article{background:#173e34;color:#fff;border-radius:28px;padding:32px}h1{font:52px Georgia}small{opacity:.65}a{color:inherit}</style><h2>Bir Kelime.</h2><p>Çevrimdışısın. Son görüntülediğin kelime burada.</p><article id="word">Kayıtlı kelime bulunamadı. İlk kelimeni görmek için internete bağlan.</article><p><a href="/">Yeniden bağlan →</a></p><script>try{const w=JSON.parse(localStorage.getItem('bk-last')||'null');if(w){const el=document.getElementById('word');el.textContent='';for(const [tag,t] of [['small',w.date+' · Son görüntülenen'],['h1',w.word],['p',w.turkishMeaning],['p',w.pronunciationTR+' '+w.ipa],['p',w.exampleSentenceEN],['p',w.exampleSentenceTR]]){const n=document.createElement(tag);n.textContent=t;el.append(n)}}}catch{}</script></html>
